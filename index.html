<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Rase · Pilah e-waste dari foto</title>
<meta name="description" content="E-Rase: aplikasi pemilahan e-waste dari foto untuk petugas bank sampah, TPS3R, dan pengepul, ditenagai metode CMRE. Prototipe BDC Satria Data 2026.">
<meta name="theme-color" content="#143f61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 16l5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

<aside class="side" aria-label="Navigasi">
  <a class="brand" href="#/"><img src="assets/logo.svg" alt=""><span><b>E-Rase</b><small>pilah e-waste, ditenagai CMRE</small></span></a>
  <a class="nav" href="#/" data-nav="home"><svg class="ico"><use href="#i-cam"/></svg>Pilah</a>
  <a class="nav" href="#/jenis" data-nav="jenis"><svg class="ico"><use href="#i-book"/></svg>Panduan jenis</a>
  <a class="nav" href="#/baru" data-nav="baru"><svg class="ico"><use href="#i-layers"/></svg>Jenis baru</a>
  <a class="nav" href="#/cara-kerja" data-nav="cara"><svg class="ico"><use href="#i-flow"/></svg>Cara kerja</a>
  <a class="nav" href="#/riwayat" data-nav="riwayat"><svg class="ico"><use href="#i-hist"/></svg>Riwayat</a>
  <div class="act">
    <button class="btn pri" type="button" data-act="quick-files"><svg class="ico"><use href="#i-img"/></svg>Pilih foto</button>
    <button class="btn" type="button" data-new="setoran"><svg class="ico"><use href="#i-doc"/></svg>Catat setoran warga</button>
  </div>
  <div class="foot"><span class="srv wait" data-srv><i></i><span>Menghubungkan…</span></span></div>
</aside>

<header class="bar">
  <a class="brand" href="#/"><img src="assets/logo.svg" alt=""><span><b>E-Rase</b></span></a>
  <span class="srv wait" data-srv><i></i><span>Menghubungkan…</span></span>
</header>

<main id="main" tabindex="-1"></main>

<nav class="tabs" aria-label="Navigasi bawah">
  <a href="#/" data-nav="home"><svg class="ico"><use href="#i-home"/></svg>Pilah</a>
  <a href="#/jenis" data-nav="jenis"><svg class="ico"><use href="#i-book"/></svg>Jenis</a>
  <button type="button" data-act="quick-cam" aria-label="Foto barang"><span class="shoot"><svg class="ico"><use href="#i-cam"/></svg></span></button>
  <a href="#/cara-kerja" data-nav="cara"><svg class="ico"><use href="#i-flow"/></svg>Cara kerja</a>
  <a href="#/riwayat" data-nav="riwayat"><svg class="ico"><use href="#i-hist"/></svg>Riwayat</a>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<input type="file" id="pickFiles" accept="image/*" multiple hidden>
<input type="file" id="pickCam" accept="image/*" capture="environment" hidden>
<input type="file" id="pickDir" webkitdirectory multiple hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
